name: github pages

env:
  SLACK_INVITE_URL: ${{ secrets.SLACK_INVITE_URL }}

on:
  workflow_dispatch:
  push:
    branches:
      - main # Set a branch to deploy
  schedule:
    - cron: 0 5 * * 0-6
jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".node-version"
      - name: npm install
        run: npm ci
      - name: npm test
        run: npm test

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.169.0"
          # extended: true

      - name: Build
        run: hugo --minify

      - name: Create evcc-media-kit.zip
        run: cd public/media-kit && zip -r ../evcc-media-kit.zip . -x '*.html'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
