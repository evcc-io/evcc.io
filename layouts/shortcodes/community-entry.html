{{- $img := .Get "img" -}}
{{- $title := .Get "title" -}}
{{- $name := .Get "name" -}}
{{- $link := .Get "link" -}}
{{- $lang := cond (fileExists (printf "static/img/community/%s-%s.webp" $img site.Language.Lang)) site.Language.Lang "en" -}}
<a href="{{ $link }}" class="community-entry">
  <div class="community-entry__imgs">
    <img
      src="/img/community/{{ $img }}.webp"
      class="community-entry__person"
      height="300"
      width="400"
      alt="{{ $name }}"
      loading="lazy"
    />
    <img
      src="/img/community/{{ $img }}-{{ $lang }}.webp"
      class="community-entry__diagram"
      height="300"
      width="400"
      alt=""
      loading="lazy"
    />
  </div>
  <p>{{ $name }}</p>
  <p>{{ $title }}</p>
</a>
